name: Release

# 每当 changelog 出现新版本就自动打 tag 并发一个 GitHub Release，
# release note 取自 changelog.md 中该版本的段落。
# 也支持手动推 v* 标签触发（例如回补历史版本）。
# Release 附件里带对应版本编译出来的 OpenCodeGoUsage.dll（x64，静态 CRT）。

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' changelog.md | head -n1)
          fi
          if [ -z "$VERSION" ]; then
            echo "changelog.md 里没有找到版本号（形如 '## [x.y] - YYYY-MM-DD'）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        shell: bash
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 {inblock = 1; next}
            inblock && /^## \[/ {exit}
            inblock {print}
          ' changelog.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "changelog.md 里没有版本 $VERSION 的段落"
            exit 1
          fi

      - name: Run unit tests
        shell: cmd
        run: |
          cd tests && build_and_run.bat

      - name: Build DLL (x64 Release)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo [ERROR] no Visual Studio with C++ tools found
            exit /b 1
          )
          "%VSPATH%\MSBuild\Current\Bin\MSBuild.exe" OpenCodeGoUsage.sln /p:Configuration=Release /p:Platform=x64 /p:TrafficMonitorPluginDir=%CD%\obj\deploy
          if errorlevel 1 exit /b 1
          dir obj\deploy

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="obj/deploy/OpenCodeGoUsage.dll"
          if [ ! -f "$ASSET" ]; then
            echo "找不到编译产物 $ASSET"
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION 已存在，补传 DLL"
            gh release upload "v$VERSION" "$ASSET" --clobber
          else
            gh release create "v$VERSION" "$ASSET" \
              --title "v$VERSION" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA"
          fi
